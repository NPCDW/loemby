# Guard against streams that end prematurely (e.g. network connection dropped and
# mpv's reconnect attempts failed). When the end of a stream is reached, this checks
# whether the end of the cached data is actually the end of the file (within
# `eof_guard_threshold` seconds). If the file is not over, a message is shown and the
# file is reloaded (resuming at the current position for VODs) once playback reaches
# the end of the cached data or the user seeks past it, instead of mpv assuming the
# file is over and advancing to the next one. Requires the demuxer cache to be enabled
# for the file (mpv's `cache` option, `auto` by default).
eof_guard=yes
# How close to the end of a file (in seconds) the end of the cached data has to be
# for the file to count as fully cached
eof_guard_threshold=2
