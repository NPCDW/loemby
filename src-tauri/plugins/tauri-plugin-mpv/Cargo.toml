[package]
name = "tauri-plugin-mpv"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-mpv"

[dependencies]
tauri = { version = "2.12.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
